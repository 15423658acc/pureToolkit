name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署在跑，避免重复部署抢占
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Build PWA
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 升级到 Node 22 LTS，避开 Node 20 已弃用警告
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        # 不用 --frozen-lockfile：本地 pnpm 版本与 CI 不同时 lockfile 可能微调
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # 部署到 https://<user>.github.io/pureToolkit/
          # base 已在 vite.config.ts 中固定为 /pureToolkit/
          CI: 'true'

      - name: Add .nojekyll
        run: touch ./dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
